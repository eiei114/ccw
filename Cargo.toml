[package]
name = "ccw"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "Claude Code multi-account launcher with a TUI picker"
license = "MIT"
repository = "https://github.com/eiei114/ccw"
homepage = "https://github.com/eiei114/ccw"
readme = "README.md"
keywords = ["claude", "claude-code", "accounts", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/SETUP-PROMPT.md"]

[[bin]]
name = "ccw"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ctrlc = "3.5"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
